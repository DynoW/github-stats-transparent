name: Generate Stats Images

on:
  push:
    branches: 
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1 # Fetches ONLY the current commit of master

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Checkout generated branch
      run: |
        git config --global user.name "github-stats[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Fetch ONLY the single latest commit of the remote generated branch (if it exists)
        git fetch origin generated --depth=1 || true
        
        # Switch to existing remote generated branch or create a fresh local orphan/branch
        git checkout -B generated origin/generated 2>/dev/null || git checkout -B generated

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS || vars.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS || vars.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: ${{ secrets.EXCLUDE_PRIVATE || vars.EXCLUDE_PRIVATE || 'false' }}
        SILENT: ${{ secrets.SILENT || vars.SILENT || 'true' }}

    - name: Commit to the repo
      run: |
        git rm -rf .
        git add overview.svg languages.svg
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated